name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the build reads the repository and writes nothing back.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Third-party actions are pinned to a full commit SHA rather than a tag, so a compromised or
      # moved tag cannot change what runs here.
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # Reports are uploaded whether or not the build passed — they are most useful when it failed.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          retention-days: 14

  licences:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Resolve runtime dependencies
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > dependencies.txt

      # NoScroll is GPL-3.0-only, so a dependency under a GPL-incompatible licence is a release
      # blocker. This catches the obvious cases; THIRD_PARTY_NOTICES.md records the audit.
      - name: Check for GPL-incompatible licences
        run: |
          set -euo pipefail
          if grep -Eiq '(^|[^a-z])(cddl|epl-2|mozilla public license 1\.1|proprietary)' dependencies.txt; then
            echo "A dependency may be under a GPL-incompatible licence. Audit it before releasing."
            exit 1
          fi
          echo "No obviously incompatible licences found."

      - name: Upload dependency tree
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-tree
          path: dependencies.txt
          retention-days: 14

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# contents: write is needed to attach artefacts to the release.
# id-token and attestations are for build provenance.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          cache-read-only: true

      - name: Verify before signing
        run: ./gradlew clean test lint --stacktrace

      # The keystore is written outside the workspace so it can never be picked up by a build step,
      # an artefact upload, or a stray `git add`.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 is not set. A release must be signed; refusing to continue."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          chmod 600 "$RUNNER_TEMP/signing/release.jks"

      - name: Build signed release
        env:
          NOSCROLL_KEYSTORE_FILE: ${{ runner.temp }}/signing/release.jks
          NOSCROLL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NOSCROLL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NOSCROLL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew packageDist --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n1)"
          "$APKSIGNER" verify --verbose --print-certs dist/*.apk
          echo "Checksum:"
          cat dist/*.sha256

      # Remove the key material before anything else runs, and before artefact upload.
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v2.4.0
        with:
          subject-path: dist/*.apk

      - name: Upload artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apk
          path: |
            dist/*.apk
            dist/*.sha256
          retention-days: 90

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            dist/*.apk
            dist/*.sha256
          generate_release_notes: true
          draft: true
          body: |
            Verify the download before installing:

            ```
            sha256sum -c NoScroll-v*.apk.sha256
            ```

            See CHANGELOG.md for what changed, and README.md for installation, including the
            "Allow restricted settings" step Android requires for sideloaded accessibility apps.
